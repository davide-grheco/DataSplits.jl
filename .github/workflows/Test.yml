name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: "1.9"
            arch: x64
            allow_failure: false
          - os: ubuntu-latest
            version: "1"
            arch: x64
            allow_failure: false
          - os: macos-latest
            version: "1"
            arch: aarch64
            allow_failure: false
          - os: windows-latest
            version: "1"
            arch: x64
            allow_failure: false
